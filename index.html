<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<title>디톤 프로필 조회 봇</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #11131a;
    --panel: #181b25;
    --panel2: #202431;
    --line: #2b3043;
    --text: #e9ebf3;
    --muted: #949ab1;
    --accent: #8b9cff;
    --on-accent: #0f1220;
    --danger: #ff7a7d;
    --online: #3ba55d;
    --idle: #f0a232;
    --dnd: #ed4245;
    --offline: #80848e;
    --radius: 14px;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f3f8;
      --panel: #ffffff;
      --panel2: #eceef6;
      --line: #dadeeb;
      --text: #171a27;
      --muted: #5d637b;
      --accent: #4a59d6;
      --on-accent: #ffffff;
      --danger: #c62f34;
      --online: #248046;
      --idle: #b8740a;
      --dnd: #d83a3d;
      --offline: #747a86;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  img { display: block; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 0 14px 40px; }

  /* 상단 바 */
  .top {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 0 14px;
  }
  .top img { width: 44px; height: 44px; border-radius: 50%; background: var(--panel2); }
  .top .brand { flex: 1; min-width: 0; }
  .top h1 { margin: 0; font-size: 19px; letter-spacing: -0.02em; line-height: 1.25; }
  .top p { margin: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .btn {
    border: 1px solid var(--line); background: var(--panel2);
    border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px;
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn:disabled { opacity: .55; cursor: default; }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  }
  .panel h2 { margin: 0 0 12px; font-size: 16px; letter-spacing: -0.01em; }

  label.f { display: block; font-size: 13px; color: var(--muted); margin: 0 0 5px; }
  .field {
    width: 100%; background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; font-size: 16px; /* iOS 확대 방지 */
  }
  .field::placeholder { color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stack > * + * { margin-top: 12px; }
  .row-end { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0; }

  /* 로그인 */
  #login { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
  #login form { width: 100%; max-width: 340px; }
  #login h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.03em; }
  #login p { margin: 0 0 18px; color: var(--muted); }
  .err { color: var(--danger); font-size: 13.5px; min-height: 20px; margin: 8px 0 0; }

  /* 필터 */
  .toolbar { display: flex; gap: 8px; margin: 12px 0 10px; }
  .toolbar .field { flex: 1; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 0 -2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--bg);
    border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 600;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chip b { font-weight: 600; opacity: .75; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 4px; font-size: 13.5px; color: var(--muted); }
  .opts label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .opts input { width: 16px; height: 16px; accent-color: var(--accent); }
  .summary { margin: 8px 0 0; font-size: 13px; color: var(--muted); }

  /* 멤버 목록 */
  .list { margin: 8px -16px 0; border-top: 1px solid var(--line); }
  .member {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 11px 16px;
  }
  .member:active { background: var(--panel2); }
  @media (hover: hover) { .member:hover { background: var(--panel2); } }
  .meta { flex: 1; min-width: 0; }
  .name { display: flex; align-items: center; gap: 6px; font-weight: 650; }
  .name span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag {
    flex: none; background: var(--accent); color: var(--on-accent);
    border-radius: 4px; font-size: 11px; font-weight: 700; padding: 0 5px; line-height: 17px;
  }
  .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cs { display: flex; align-items: center; gap: 5px; font-size: 13.5px; margin-top: 1px; }
  .cs span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st { flex: none; font-size: 12.5px; font-weight: 600; }
  .st.online { color: var(--online); } .st.idle { color: var(--idle); }
  .st.dnd { color: var(--dnd); } .st.offline { color: var(--muted); }
  .emoji { width: 18px; height: 18px; object-fit: contain; }

  .av { position: relative; flex: none; width: var(--s); height: var(--s); }
  .av img { width: 100%; height: 100%; border-radius: 50%; background: var(--panel2); object-fit: cover; }
  .dot {
    position: absolute; right: -1px; bottom: -1px;
    width: calc(var(--s) * .32); height: calc(var(--s) * .32); min-width: 12px; min-height: 12px;
    border-radius: 50%; border: 3px solid var(--ring, var(--panel));
  }
  .dot.online { background: var(--online); } .dot.idle { background: var(--idle); }
  .dot.dnd { background: var(--dnd); } .dot.offline { background: var(--offline); }

  .empty { padding: 30px 16px; text-align: center; color: var(--muted); }
  .more { display: block; margin: 14px auto 0; }

  /* 프로필 시트 */
  #modal {
    position: fixed; inset: 0; z-index: 20; background: rgba(6, 8, 14, .66);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    --ring: var(--panel);
    width: 100%; max-width: 460px; max-height: 92dvh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 20px 20px 0 0; position: relative;
    padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    animation: rise .22s ease-out;
  }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (min-width: 600px) {
    #modal { align-items: center; }
    .sheet { border-radius: 20px; padding-bottom: 18px; }
  }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

  .banner {
    height: 128px; background: linear-gradient(135deg, var(--accent), var(--panel2));
    border-radius: 20px 20px 0 0; overflow: hidden; position: relative;
  }
  .banner img { width: 100%; height: 100%; object-fit: cover; }
  .banner.loading::after {
    content: "배너 확인 중…"; position: absolute; left: 14px; bottom: 10px;
    font-size: 12px; color: #fff; background: rgba(0,0,0,.45); padding: 2px 8px; border-radius: 999px;
  }
  .close {
    position: absolute; top: 10px; right: 10px; z-index: 2;
    width: 36px; height: 36px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.5); color: #fff; font-size: 18px; line-height: 1;
  }
  .phead { padding: 0 18px; margin-top: -42px; position: relative; }
  .phead .av img { border: 5px solid var(--panel); }
  .phead .dot { border-width: 4px; }
  .pname { margin: 10px 0 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; word-break: break-word; }
  .puser { color: var(--muted); font-size: 14px; word-break: break-all; }
  .pbody { padding: 6px 18px 0; }
  .block { background: var(--panel2); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  .block h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .block .cs { font-size: 15px; margin: 0; }
  .block p { margin: 0; }
  .kv { display: grid; grid-template-columns: 76px 1fr; gap: 4px 10px; font-size: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; word-break: break-all; }
  .roles { display: flex; flex-wrap: wrap; gap: 6px; }
  .role {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px 2px 8px; background: var(--bg);
  }
  .role i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .links a, .links button { text-decoration: none; }

  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); z-index: 40; max-width: 90vw;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px;
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
  #toast.bad { background: var(--danger); color: #fff; }
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <h1>디톤 프로필 조회 봇</h1>
    <p>관리자 비밀번호를 입력해 로그인하세요.</p>
    <label class="f" for="pw">비밀번호</label>
    <input class="field" id="pw" type="password" autocomplete="current-password" required>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn primary" style="width:100%;margin-top:6px" type="submit" id="loginBtn">로그인</button>
  </form>
</div>

<!-- 메인 화면 -->
<div id="app" hidden>
  <div class="wrap">
    <header class="top">
      <img id="botAvatar" alt="" width="44" height="44">
      <div class="brand">
        <h1>디톤 프로필 조회 봇</h1>
        <p id="botTag">불러오는 중…</p>
      </div>
      <button class="btn" id="logoutBtn" type="button">로그아웃</button>
    </header>

    <section class="panel" aria-labelledby="h-status">
      <h2 id="h-status">봇 상태메시지</h2>
      <form id="statusForm" class="stack">
        <div>
          <label class="f" for="stText">상태메시지 (최대 128자, 비우면 삭제)</label>
          <input class="field" id="stText" type="text" maxlength="128" placeholder="예: 서버 멤버를 조회하는 중">
        </div>
        <div class="grid2">
          <div>
            <label class="f" for="stType">표시 형식</label>
            <select class="field" id="stType">
              <option value="custom">커스텀 상태</option>
              <option value="playing">~ 하는 중</option>
              <option value="watching">~ 시청 중</option>
              <option value="listening">~ 듣는 중</option>
              <option value="competing">~ 경쟁 중</option>
            </select>
          </div>
          <div>
            <label class="f" for="stPresence">접속 상태</label>
            <select class="field" id="stPresence">
              <option value="online">온라인</option>
              <option value="idle">자리비움</option>
              <option value="dnd">방해금지</option>
              <option value="invisible">오프라인(숨김)</option>
            </select>
          </div>
        </div>
        <div class="row-end">
          <button class="btn primary" type="submit" id="stBtn">상태 적용</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="h-members">
      <h2 id="h-members">서버 멤버 조회</h2>
      <label class="f" for="guildSelect">서버 선택</label>
      <select class="field" id="guildSelect"></select>

      <div class="toolbar">
        <input class="field" id="search" type="search" placeholder="이름, 아이디, 상태메시지 검색" autocomplete="off">
        <button class="btn" id="reload" type="button">새로고침</button>
      </div>

      <div class="chips" id="chips" role="group" aria-label="접속 상태 필터"></div>

      <div class="opts">
        <label><input type="checkbox" id="hideBots"> 봇 숨기기</label>
        <label><input type="checkbox" id="autoRefresh"> 30초마다 자동 갱신</label>
      </div>
      <p class="summary" id="summary"></p>

      <div class="list" id="list"></div>
      <button class="btn more" id="moreBtn" type="button" hidden>더 보기</button>
      <p class="hint" style="margin-top:12px">멤버를 누르면 배너와 역할 등 상세 프로필을 볼 수 있습니다.</p>
    </section>
  </div>
</div>

<!-- 프로필 시트 -->
<div id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="멤버 프로필" id="sheet"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

// ── 공용 유틸 ─────────────────────────────
const $ = (sel) => document.querySelector(sel);

// innerHTML을 쓰지 않고 안전하게 DOM을 만드는 헬퍼 (유저 이름 등 XSS 방지)
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

let toastTimer = null;
function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 2600);
}

async function api(url, opts) {
  const res = await fetch(url, {
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    ...(opts || {}),
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* 본문 없음 */ }
  if (res.status === 401) { showLogin(); throw new Error('로그인이 필요합니다.'); }
  if (!res.ok) throw new Error((data && data.error) || `요청 실패 (${res.status})`);
  return data;
}

const STATUS_LABEL = { online: '온라인', idle: '자리비움', dnd: '방해금지', offline: '오프라인' };
const STATUS_ORDER = { online: 0, dnd: 1, idle: 2, offline: 3 };
const DEVICE_LABEL = { desktop: '컴퓨터', mobile: '모바일', web: '웹' };
const BADGE_LABEL = {
  Staff: '디스코드 직원', Partner: '파트너', Hypesquad: 'HypeSquad 이벤트',
  BugHunterLevel1: '버그 헌터', BugHunterLevel2: '버그 헌터 Lv2',
  HypeSquadOnlineHouse1: 'Bravery', HypeSquadOnlineHouse2: 'Brilliance', HypeSquadOnlineHouse3: 'Balance',
  PremiumEarlySupporter: '얼리 서포터', VerifiedBot: '인증된 봇', VerifiedDeveloper: '인증된 봇 개발자',
  CertifiedModerator: '공인 중재자', ActiveDeveloper: '활성 개발자',
};

const fmtDate = (ms) => (ms ? new Date(ms).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }) : '알 수 없음');

// ── 화면 전환 ─────────────────────────────
function showLogin() {
  stopAuto();
  closeProfile();
  $('#app').hidden = true;
  $('#login').hidden = false;
  $('#pw').value = '';
  $('#pw').focus();
}

function showApp() {
  $('#login').hidden = true;
  $('#app').hidden = false;
}

// ── 로그인 / 로그아웃 ─────────────────────
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#loginBtn');
  btn.disabled = true;
  $('#loginErr').textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('#pw').value }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || '로그인에 실패했습니다.');
    await loadApp();
  } catch (err) {
    $('#loginErr').textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

$('#logoutBtn').addEventListener('click', async () => {
  try { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) { /* 무시 */ }
  showLogin();
});

// ── 봇 정보 / 상태메시지 ──────────────────
async function loadApp() {
  showApp();
  const bot = await api('/api/bot');
  $('#botAvatar').src = bot.avatar;
  $('#botTag').textContent = `${bot.tag} · 서버 ${bot.guildCount}개`;
  $('#stText').value = bot.state.text;
  $('#stType').value = bot.state.type;
  $('#stPresence').value = bot.state.status;

  const { guilds } = await api('/api/guilds');
  const sel = $('#guildSelect');
  sel.replaceChildren();
  if (!guilds.length) {
    sel.append(h('option', { value: '', text: '봇이 참여한 서버가 없습니다' }));
    renderList();
    return;
  }
  sel.append(h('option', { value: '', text: '서버를 선택하세요' }));
  for (const g of guilds) sel.append(h('option', { value: g.id, text: `${g.name} (${g.memberCount}명)` }));

  let last = '';
  try { last = localStorage.getItem('diton:guild') || ''; } catch (e) { /* 저장소 사용 불가 */ }
  if (last && guilds.some((g) => g.id === last)) {
    sel.value = last;
    loadMembers(last);
  } else {
    renderList();
  }
}

$('#statusForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#stBtn');
  btn.disabled = true;
  try {
    await api('/api/bot/status', {
      method: 'POST',
      body: JSON.stringify({
        text: $('#stText').value,
        type: $('#stType').value,
        status: $('#stPresence').value,
      }),
    });
    toast('상태를 적용했습니다.');
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false;
  }
});

// ── 멤버 목록 ─────────────────────────────
const state = { guildId: '', members: [], filter: 'all', query: '', hideBots: false, limit: 100, loading: false };
const PAGE = 100;
let autoTimer = null;
let loadSeq = 0;

function stopAuto() { clearInterval(autoTimer); autoTimer = null; }

function sortMembers(list) {
  return list.sort((a, b) =>
    (STATUS_ORDER[a.status] ?? 9) - (STATUS_ORDER[b.status] ?? 9) ||
    a.displayName.localeCompare(b.displayName, 'ko'));
}

async function loadMembers(gid, silent) {
  if (!gid) {
    state.guildId = '';
    state.members = [];
    renderList();
    return;
  }
  const seq = ++loadSeq;
  state.guildId = gid;
  if (!silent) {
    state.loading = true;
    state.members = [];
    state.limit = PAGE;
    renderList();
  }
  try {
    const data = await api(`/api/guilds/${encodeURIComponent(gid)}/members`);
    if (seq !== loadSeq) return; // 더 최신 요청이 있으면 무시
    state.members = sortMembers(data.members);
  } catch (err) {
    if (seq !== loadSeq) return;
    toast(err.message, true);
  } finally {
    if (seq === loadSeq) {
      state.loading = false;
      renderList();
    }
  }
}

function emojiEl(emoji) {
  if (!emoji) return null;
  if (emoji.id) {
    return h('img', {
      class: 'emoji', alt: emoji.name || '',
      src: `https://cdn.discordapp.com/emojis/${emoji.id}.${emoji.animated ? 'gif' : 'png'}?size=48`,
    });
  }
  return h('span', { text: emoji.name || '' });
}

function customEl(c) {
  if (!c || (!c.text && !c.emoji)) return null;
  return h('div', { class: 'cs' }, emojiEl(c.emoji), c.text ? h('span', { text: c.text }) : null);
}

function avatarEl(src, status, size, ring) {
  return h('div', { class: 'av', style: `--s:${size}px;` + (ring ? `--ring:${ring};` : '') },
    h('img', { src, alt: '', width: size, height: size, loading: 'lazy' }),
    h('span', { class: `dot ${status}`, title: STATUS_LABEL[status] }));
}

function visibleMembers() {
  const q = state.query.trim().toLowerCase();
  return state.members.filter((m) => {
    if (state.hideBots && m.bot) return false;
    if (state.filter !== 'all' && m.status !== state.filter) return false;
    if (!q) return true;
    return m.displayName.toLowerCase().includes(q) ||
      m.username.toLowerCase().includes(q) ||
      m.id === q ||
      (m.custom && m.custom.text && m.custom.text.toLowerCase().includes(q));
  });
}

function renderChips() {
  const base = state.members.filter((m) => !state.hideBots || !m.bot);
  const counts = { all: base.length, online: 0, idle: 0, dnd: 0, offline: 0 };
  for (const m of base) counts[m.status] = (counts[m.status] || 0) + 1;

  const defs = [
    ['all', '전체', null], ['online', '온라인', 'var(--online)'], ['idle', '자리비움', 'var(--idle)'],
    ['dnd', '방해금지', 'var(--dnd)'], ['offline', '오프라인', 'var(--offline)'],
  ];
  $('#chips').replaceChildren(...defs.map(([key, label, color]) =>
    h('button', {
      class: 'chip', type: 'button', 'aria-pressed': String(state.filter === key),
      onclick: () => { state.filter = key; state.limit = PAGE; renderList(); },
    }, color ? h('i', { style: `background:${color}` }) : null, label, h('b', { text: counts[key] || 0 }))));
}

function renderList() {
  renderChips();
  const list = $('#list');
  const more = $('#moreBtn');
  more.hidden = true;

  if (state.loading) {
    $('#summary').textContent = '';
    list.replaceChildren(h('div', { class: 'empty', text: '멤버를 불러오는 중입니다. 대형 서버는 최초 1회 시간이 걸릴 수 있습니다.' }));
    return;
  }
  if (!state.guildId) {
    $('#summary').textContent = '';
    list.replaceChildren(h('div', { class: 'empty', text: '서버를 선택하면 멤버 목록이 표시됩니다.' }));
    return;
  }

  const rows = visibleMembers();
  $('#summary').textContent = `${rows.length}명 표시 중 (서버 전체 ${state.members.length}명)`;

  if (!rows.length) {
    list.replaceChildren(h('div', { class: 'empty', text: '조건에 맞는 멤버가 없습니다. 검색어나 필터를 바꿔 보세요.' }));
    return;
  }

  const shown = rows.slice(0, state.limit);
  list.replaceChildren(...shown.map(memberRow));
  if (rows.length > shown.length) {
    more.hidden = false;
    more.textContent = `더 보기 (${rows.length - shown.length}명 남음)`;
  }
}

function memberRow(m) {
  const act = m.activities[0];
  return h('button', { class: 'member', type: 'button', onclick: () => openProfile(m) },
    avatarEl(m.avatar, m.status, 44),
    h('div', { class: 'meta' },
      h('div', { class: 'name' },
        h('span', { class: 't', text: m.displayName }),
        m.bot ? h('span', { class: 'tag', text: '봇' }) : null),
      h('div', { class: 'sub', text: '@' + m.username }),
      customEl(m.custom),
      act ? h('div', { class: 'act', text: `${act.type} ${act.name}` }) : null),
    h('span', { class: `st ${m.status}`, text: STATUS_LABEL[m.status] }));
}

$('#guildSelect').addEventListener('change', (e) => {
  const gid = e.target.value;
  try { localStorage.setItem('diton:guild', gid); } catch (err) { /* 무시 */ }
  state.filter = 'all';
  loadMembers(gid);
});
$('#reload').addEventListener('click', () => { if (state.guildId) loadMembers(state.guildId); });
$('#search').addEventListener('input', (e) => { state.query = e.target.value; state.limit = PAGE; renderList(); });
$('#hideBots').addEventListener('change', (e) => { state.hideBots = e.target.checked; state.limit = PAGE; renderList(); });
$('#moreBtn').addEventListener('click', () => { state.limit += PAGE; renderList(); });
$('#autoRefresh').addEventListener('change', (e) => {
  stopAuto();
  if (e.target.checked) {
    autoTimer = setInterval(() => {
      if (state.guildId && !document.hidden && $('#modal').hidden) loadMembers(state.guildId, true);
    }, 30000);
  }
});

// ── 프로필 시트 ───────────────────────────
let lastFocus = null;
let profileSeq = 0;

function closeProfile() {
  profileSeq++;
  $('#modal').hidden = true;
  document.body.style.overflow = '';
  if (lastFocus && lastFocus.focus) lastFocus.focus();
  lastFocus = null;
}

function buildProfile(m, extra, loading) {
  const status = m.status;
  const bannerBox = h('div', { class: 'banner' + (loading ? ' loading' : '') });
  const bannerUrl = extra && (extra.memberBanner || extra.banner);
  if (bannerUrl) {
    bannerBox.append(h('img', { src: bannerUrl, alt: '프로필 배너' }));
  } else {
    const color = (extra && extra.accentColor) || m.roleColor;
    if (color) bannerBox.style.background = color;
  }

  const devices = Object.keys(m.clientStatus || {}).map((k) => DEVICE_LABEL[k] || k);
  const cs = customEl(m.custom);

  const kv = [
    ['접속 상태', STATUS_LABEL[status] + (devices.length ? ` (${devices.join(', ')})` : '')],
    ['유저 ID', m.id],
    ['서버 가입', fmtDate(m.joinedAt)],
  ];
  if (extra) kv.push(['계정 생성', fmtDate(extra.createdAt)]);

  const badges = extra && extra.badges ? extra.badges.map((b) => BADGE_LABEL[b] || b) : [];
  const roles = extra && extra.roles ? extra.roles : null;
  const fullAvatar = (extra && extra.avatarLarge) || m.avatar;

  return [
    h('button', { class: 'close', type: 'button', 'aria-label': '닫기', onclick: closeProfile, text: '✕' }),
    bannerBox,
    h('div', { class: 'phead' },
      avatarEl(fullAvatar, status, 84),
      h('p', { class: 'pname' }, m.displayName, m.bot ? ' ' : null, m.bot ? h('span', { class: 'tag', text: '봇' }) : null),
      h('div', { class: 'puser', text: '@' + m.username + (m.globalName && m.globalName !== m.displayName ? ` · ${m.globalName}` : '') })),
    h('div', { class: 'pbody' },
      h('div', { class: 'block' }, h('h3', { text: '상태메시지' }),
        cs || h('p', { class: 'hint', text: '설정된 상태메시지가 없습니다.' })),
      m.activities.length ? h('div', { class: 'block' }, h('h3', { text: '활동' }),
        m.activities.map((a) => h('p', { text: `${a.type} ${a.name}` + (a.details ? ` · ${a.details}` : '') + (a.state ? ` · ${a.state}` : '') }))) : null,
      h('div', { class: 'block' }, h('h3', { text: '정보' }),
        h('dl', { class: 'kv' }, kv.map(([k, v]) => [h('dt', { text: k }), h('dd', { text: v })]))),
      badges.length ? h('div', { class: 'block' }, h('h3', { text: '배지' }), h('p', { text: badges.join(', ') })) : null,
      roles && roles.length ? h('div', { class: 'block' }, h('h3', { text: `역할 ${roles.length}개` }),
        h('div', { class: 'roles' }, roles.map((r) => h('span', { class: 'role' },
          h('i', { style: r.color ? `background:${r.color}` : '' }), r.name)))) : null,
      h('div', { class: 'links' },
        h('a', { class: 'btn', href: fullAvatar, target: '_blank', rel: 'noopener noreferrer', text: '아바타 원본' }),
        bannerUrl ? h('a', { class: 'btn', href: bannerUrl, target: '_blank', rel: 'noopener noreferrer', text: '배너 원본' }) : null,
        h('button', { class: 'btn', type: 'button', text: 'ID 복사', onclick: async () => {
          try { await navigator.clipboard.writeText(m.id); toast('ID를 복사했습니다.'); } catch (e) { toast('복사하지 못했습니다.', true); }
        } }))),
  ];
}

async function openProfile(m) {
  const seq = ++profileSeq;
  lastFocus = document.activeElement;
  const sheet = $('#sheet');
  sheet.replaceChildren(...buildProfile(m, null, true));
  $('#modal').hidden = false;
  document.body.style.overflow = 'hidden';
  sheet.scrollTop = 0;
  sheet.querySelector('.close').focus();

  try {
    const detail = await api(`/api/guilds/${encodeURIComponent(state.guildId)}/members/${encodeURIComponent(m.id)}`);
    if (seq !== profileSeq) return;
    const top = sheet.scrollTop;
    sheet.replaceChildren(...buildProfile(detail, detail, false));
    sheet.scrollTop = top;
    sheet.querySelector('.close').focus();
  } catch (err) {
    if (seq !== profileSeq) return;
    sheet.replaceChildren(...buildProfile(m, null, false));
    sheet.querySelector('.close').focus();
    toast(err.message, true);
  }
}

$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeProfile(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#modal').hidden) closeProfile(); });

// ── 시작 ──────────────────────────────────
(async function init() {
  try {
    const res = await fetch('/api/session', { credentials: 'same-origin' });
    const data = await res.json();
    if (data.authed) await loadApp();
    else showLogin();
  } catch (err) {
    showLogin();
  }
})();
</script>
</body>
</html>
